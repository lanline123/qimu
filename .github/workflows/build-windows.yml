# 启幕 Windows 试装包构建 —— 只构建客户端 (含随客户端包出货的 CLI qimu.exe;
# 用户 2026-11-24 口径:
# 构建只建客户端、不用构建服务端; 且用 staging 非正式包 profile
# 求快 —— opt-level 2 / codegen-units 32 / 无 LTO, 见根 Cargo.toml)。
#
# 路径: ubuntu + mingw 交叉编译 x86_64-pc-windows-gnu
# (staging) -> makensis 出客户端 NSIS 包 -> 作为 artifact 上传。
# 手动触发 (workflow_dispatch), 也可在推送到 main 时按需开启 push 触发。
#
# 注意 (落仓须知): 本文件受 GitHub App 权限限制, 无法经 Muse 的
# GitHub App 推送 (App 无 .github/workflows 写权限), 需经 GitHub 网页端
# 或 PAT 写入仓库后才会生效。见 ~/workspace/qimu-ui-update/REPORT.md。

name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: vendor/deckcraft (DeckCraft full integration,
      # PLAN §4 form 1). Harmless before P1 wires the path deps;
      # required from P1 on.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 字体口径 (用户 2026-11-25 改定, 覆盖 2026-11-23 内嵌口径与
      # transplant T0 字体门): 全走系统字体, 不再内嵌 craft-fonts。
      # deckcraft-fonts 的 build.rs 在 CRAFT_FONTS_DIR 缺省时不嵌入
      # 任何字体, 渲染走系统字体目录 (中文 Windows 自带雅黑/宋体)。
      # 原 craft-fonts checkout 步骤与 CRAFT_FONTS_* 环境变量已撤下。

      - name: Install mingw + NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 nsis

      # Toolchain pinned to 1.95: DeckCraft declares rust-version
      # 1.95 (edition 2024 / resolver 3); qimu's own crates stay on
      # edition 2021 but must compile under the same toolchain once
      # the workspaces share a build (P0 alignment, PLAN §7 risk 6).
      - name: Install Rust (gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: x86_64-pc-windows-gnu

      # 编译缓存 (用户 2026-11-25 定, 提速方案一): 依赖包 (~700 个,
      # 含 DeckCraft 全栈) 编译一次后缓存复用, 日常只重编自有 crate。
      # 注意: 缓存键不含构建环境变量 — 若将来恢复字体内嵌
      # (CRAFT_FONTS_DIR), 需先手动清缓存防旧产物串味。
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: qimu-build-windows

      - name: Build client only (staging profile, windows-gnu)
        run: cargo build --profile staging --target x86_64-pc-windows-gnu -p qimu-client -p qimu-cli

      # NOTE (ruling 2026-11-24): the client installer does NOT
      # bundle the DeckCraft desktop app. Presentation jumps locate
      # a user-installed DeckCraft ($QIMU_DECKCRAFT_APP, exe-dir,
      # PATH) and prompt the user to install it when absent.

      - name: Stage binaries for NSIS
        run: |
          mkdir -p packaging/win
          cp target/x86_64-pc-windows-gnu/staging/qimu-client.exe packaging/win/
          cp target/x86_64-pc-windows-gnu/staging/qimu.exe packaging/win/
          cp packaging/使用说明.txt packaging/win/

      - name: Generate installer icon (brand logo)
        shell: pwsh
        run: |
          # Single source of truth: crates/qimu-client/assets/logo.png.b64
          # (the same asset the GUI renders and build.rs embeds in the
          # exe). Wrap the PNG in a single-image .ico for NSIS: the
          # installer header icon (packaging/qimu.ico) and the payload
          # icon both .nsi scripts install as win/qimu.ico.
          $b64 = (Get-Content -Raw crates/qimu-client/assets/logo.png.b64) -replace '\s', ''
          $png = [Convert]::FromBase64String($b64)
          $w = [BitConverter]::ToUInt32(@($png[19], $png[18], $png[17], $png[16]), 0)
          $h = [BitConverter]::ToUInt32(@($png[23], $png[22], $png[21], $png[20]), 0)
          if ($w -lt 1 -or $w -gt 256 -or $h -lt 1 -or $h -gt 256) { throw "logo PNG size ${w}x${h} not wrappable" }
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]1)
          $bw.Write([byte]($(if ($w -eq 256) { 0 } else { $w })))
          $bw.Write([byte]($(if ($h -eq 256) { 0 } else { $h })))
          $bw.Write([byte]0); $bw.Write([byte]0)
          $bw.Write([uint16]1); $bw.Write([uint16]32)
          $bw.Write([uint32]$png.Length); $bw.Write([uint32]22)
          $bw.Write($png); $bw.Flush()
          [System.IO.File]::WriteAllBytes("packaging/qimu.ico", $ms.ToArray())
          Copy-Item packaging/qimu.ico packaging/win/qimu.ico
          Write-Host "qimu.ico generated: $((Get-Item packaging/qimu.ico).Length) bytes"

      - name: Build client installer
        working-directory: packaging
        run: |
          cp 启幕-客户端.nsi qimu-client-setup.nsi
          LC_ALL=C.UTF-8 makensis qimu-client-setup.nsi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: qimu-windows-setups
          path: |
            packaging/启幕客户端-Setup.exe
