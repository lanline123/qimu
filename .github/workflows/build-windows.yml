# 启幕 Windows 试装包构建 —— 客户端与服务器两个独立安装包
#
# 路径与作者本机出包一致: ubuntu + mingw 交叉编译 x86_64-pc-windows-gnu
# (release) -> makensis 出两个 NSIS 包 -> 作为 artifact 上传。
# 手动触发 (workflow_dispatch), 也可在推送到 main 时按需开启 push 触发。
#
# 注意 (落仓须知): 本文件受 GitHub App 权限限制, 无法经 Muse 的
# GitHub App 推送 (App 无 .github/workflows 写权限), 需经 GitHub 网页端
# 或 PAT 写入仓库后才会生效。见 ~/workspace/qimu-ui-update/REPORT.md。

name: build-windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # submodules: vendor/deckcraft (DeckCraft full integration,
      # PLAN §4 form 1). Harmless before P1 wires the path deps;
      # required from P1 on.
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Bundled fonts source: the user's own craft-fonts fork, pinned
      # by full commit SHA (bump deliberately, like every other pin).
      # Public repo; the fonts themselves never enter this repo.
      - uses: actions/checkout@v4
        with:
          repository: lanline123/craft-fonts
          ref: 26a79230872f9b2acd3dd68500677e294350ab94
          path: craft-fonts

      - name: Install mingw + NSIS
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-x86-64 nsis

      # Toolchain pinned to 1.95: DeckCraft declares rust-version
      # 1.95 (edition 2024 / resolver 3); qimu's own crates stay on
      # edition 2021 but must compile under the same toolchain once
      # the workspaces share a build (P0 alignment, PLAN §7 risk 6).
      - name: Install Rust (gnu target)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: x86_64-pc-windows-gnu

      - name: Optional — embed Alibaba PuHuiTi font
        # 字体文件不入仓 (见 crates/qimu-client/assets/README.md)。
        # 若仓库变量 QIMU_FONT_URL 已配置, 下载并按 README 中的
        # SHA-256 校验后放进 assets/; 未配置则跳过, 客户端回退系统字体。
        if: ${{ vars.QIMU_FONT_URL != '' }}
        run: |
          curl -fL "${{ vars.QIMU_FONT_URL }}" -o crates/qimu-client/assets/AlibabaPuHuiTi-3-55-Regular.ttf
          echo "be33bc8d45ced30fa5c542f6f056565baf85003d4e079522110d76016f8a04e2  crates/qimu-client/assets/AlibabaPuHuiTi-3-55-Regular.ttf" | sha256sum -c -

      - name: Build client + server + cli (release, windows-gnu)
        run: cargo build --release --target x86_64-pc-windows-gnu -p qimu-client -p qimu-server -p qimu-cli

      # deckcraft-cli: the server's thumbnail renderer (and the PDF
      # export engine once that endpoint lands). The server resolves
      # the binary next to qimu-server.exe (QIMU_DECKCRAFT_CLI env,
      # then exe-dir, then PATH), so it must ship inside the server
      # installer — until now the installer never carried it and
      # clean installs silently fell back to LibreOffice. Built from
      # the vendor/deckcraft submodule workspace, the same workspace
      # thumb-dual-track builds natively for the verdict.
      # NOTE: the windows-gnu cross build of the deckcraft engine is
      # verified by THIS step (test -f below): if it fails, the run
      # goes red here instead of shipping a renderer-less server.
      - name: Build deckcraft-cli (release, windows-gnu)
        working-directory: vendor/deckcraft
        run: |
          cargo build --release --target x86_64-pc-windows-gnu -p deckcraft-cli
          test -f target/x86_64-pc-windows-gnu/release/deckcraft-cli.exe

      # NOTE (ruling 2026-11-24): the client installer does NOT
      # bundle the DeckCraft desktop app. Presentation jumps locate
      # a user-installed DeckCraft ($QIMU_DECKCRAFT_APP, exe-dir,
      # PATH) and prompt the user to install it when absent.

      - name: Stage binaries for NSIS
        run: |
          mkdir -p packaging/win
          cp target/x86_64-pc-windows-gnu/release/qimu-client.exe packaging/win/
          cp target/x86_64-pc-windows-gnu/release/qimu-server.exe packaging/win/
          cp target/x86_64-pc-windows-gnu/release/qimu.exe packaging/win/
          cp vendor/deckcraft/target/x86_64-pc-windows-gnu/release/deckcraft-cli.exe packaging/win/
          cp packaging/使用说明.txt packaging/win/

      - name: Stage bundled fonts (craft-fonts, Simplified Chinese + Latin)
        # User ruling 2026-11-23: the installer bundles ONLY the
        # Simplified Chinese manifest and the Latin manifest of
        # craft-fonts — no other scripts. Every file's SHA-256 is
        # verified against its manifest line; any mismatch or missing
        # file fails the build (a release must not silently ship
        # without its fonts). Payload lands in packaging/win/fonts/,
        # which the client NSI installs as fonts/ beside the exe and
        # the client loads through craft-font-catalog at startup.
        run: |
          python3 - <<'PYEOF'
          import hashlib, pathlib, shutil, sys
          root = pathlib.Path("craft-fonts")
          out = pathlib.Path("packaging/win/fonts")
          manifests = ["simplified-chinese-manifest.txt", "latin-manifest.txt"]
          total = 0
          count = 0
          licences = set()
          for name in manifests:
              mpath = root / "fonts" / name
              for line in mpath.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  f = [x.strip() for x in line.split("|")]
                  file, licence_file, sha = f[2], f[5], f[6]
                  src = root / file
                  if hashlib.sha256(src.read_bytes()).hexdigest() != sha:
                      sys.exit(f"sha256 mismatch: {file}")
                  dst = out / pathlib.Path(file).relative_to("fonts")
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(src, dst)
                  total += src.stat().st_size
                  count += 1
                  licences.add(licence_file)
          for lf in sorted(licences):
              src = root / lf
              dst = out / pathlib.Path(lf).relative_to("fonts")
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
              total += src.stat().st_size
          for name in manifests:
              shutil.copyfile(root / "fonts" / name, out / name)
              total += (root / "fonts" / name).stat().st_size
          print(f"bundled fonts: {count} faces staged into {out}, {total} bytes total")
          PYEOF

      - name: Generate installer icon (brand logo)
        shell: pwsh
        run: |
          # Single source of truth: crates/qimu-client/assets/logo.png.b64
          # (the same asset the GUI renders and build.rs embeds in the
          # exe). Wrap the PNG in a single-image .ico for NSIS: the
          # installer header icon (packaging/qimu.ico) and the payload
          # icon both .nsi scripts install as win/qimu.ico.
          $b64 = (Get-Content -Raw crates/qimu-client/assets/logo.png.b64) -replace '\s', ''
          $png = [Convert]::FromBase64String($b64)
          $w = [BitConverter]::ToUInt32(@($png[19], $png[18], $png[17], $png[16]), 0)
          $h = [BitConverter]::ToUInt32(@($png[23], $png[22], $png[21], $png[20]), 0)
          if ($w -lt 1 -or $w -gt 256 -or $h -lt 1 -or $h -gt 256) { throw "logo PNG size ${w}x${h} not wrappable" }
          $ms = New-Object System.IO.MemoryStream
          $bw = New-Object System.IO.BinaryWriter($ms)
          $bw.Write([uint16]0); $bw.Write([uint16]1); $bw.Write([uint16]1)
          $bw.Write([byte]($(if ($w -eq 256) { 0 } else { $w })))
          $bw.Write([byte]($(if ($h -eq 256) { 0 } else { $h })))
          $bw.Write([byte]0); $bw.Write([byte]0)
          $bw.Write([uint16]1); $bw.Write([uint16]32)
          $bw.Write([uint32]$png.Length); $bw.Write([uint32]22)
          $bw.Write($png); $bw.Flush()
          [System.IO.File]::WriteAllBytes("packaging/qimu.ico", $ms.ToArray())
          Copy-Item packaging/qimu.ico packaging/win/qimu.ico
          Write-Host "qimu.ico generated: $((Get-Item packaging/qimu.ico).Length) bytes"

      - name: Build client installer
        working-directory: packaging
        run: |
          cp 启幕-客户端.nsi qimu-client-setup.nsi
          LC_ALL=C.UTF-8 makensis qimu-client-setup.nsi

      - name: Build server installer
        working-directory: packaging
        run: |
          cp 启幕-服务器.nsi qimu-server-setup.nsi
          LC_ALL=C.UTF-8 makensis qimu-server-setup.nsi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: qimu-windows-setups
          path: |
            packaging/启幕客户端-Setup.exe
            packaging/启幕服务器-Setup.exe
