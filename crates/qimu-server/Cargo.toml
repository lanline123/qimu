[package]
name = "qimu-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "qimu-server"
path = "src/main.rs"

[dependencies]
qimu-core = { path = "../qimu-core" }
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
