[package]
name = "qimu-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "qimu-client"
path = "src/main.rs"

[dependencies]
qimu-core = { path = "../qimu-core" }
qimu-bridge = { path = "../qimu-bridge" }
# eframe with the glow renderer only (as in the 0.29 era): the 0.37
# default set pulls in wgpu, whose dx12 backend does not compile for
# x86_64-pc-windows-gnu (windows-crate version skew inside wgpu-hal),
# which is the trial package's toolchain.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.37"
# Match the workspace's egui revision so the native font provider uses the same epaint types.
egui_system_font_provider = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
fontique = { version = "0.11.1", default-features = false, features = ["system"] }
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rfd = "0.15"

# craft-i18n (storytold/craft-libs@b9c7b69, MIT OR Apache-2.0): the
# source-keyed localization runtime; catalogs live in locales/*.tsv in
# the storytold/craft-i18n TSV format.
craft-i18n = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }
# craft-ui (storytold/craft-libs@b9c7b69, MIT OR Apache-2.0): the Craft
# component library on the egui fork; adopted component by component
# with its native interaction model (step 6b: buttons::IconButton;
# framework round: docking — the feature set matches EffectCraft's
# own workspace pin: "serde" unlocks docking::DockCommand).
craft-ui = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a", features = ["serde"] }
aes-gcm = "0.10"
image = "0.25"
# storytold/craft-libs (MIT OR Apache-2.0), pinned git rev — see design/组件接入台账.md
craft-atomic = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }
# PdfCraft page rasterizer (storytold/pdfcraft@27287c2, MIT OR Apache-2.0):
# renders attachment PDFs to page images for the in-client preview.
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
# craft-update protocol layer (storytold/craft-libs@b9c7b69, MIT OR
# Apache-2.0): parse_github_release_list + offers_update +
# download_url_under_mirror drive the LAN update-mirror check (prompt only).
craft-update = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }
# ---------------------------------------------------------------------------
# craft-libs baseline (phase 1, route plan §5 stage 1; supersedes
# the P0 per-crate pin alignment that used to be documented here):
# every craft-* pin in this workspace now names our fork
# lanline123/craft-libs @ b9c7b69, and the root Cargo.toml [patch]
# tables redirect all craft-libs requests in the unified graph —
# qimu's own, DeckCraft's (storytold pins at five different revs)
# and PdfCraft's (e2dc681) — to the single submodule copy at
# vendor/craft-libs. One baseline for the whole graph; bumps move
# the submodule pointer and these pins together, gated by CI
# (route plan §6 item 2 retires the P0 alignment notes).
#
# P1 reserved wiring (PLAN §4 consumption surface / §6 P1),
# progressively enabled as the capabilities land in-process
# (DeckCraft transplant, DESIGN §6):
# - T0 (thumbnails + page-edit stage preview in-process): model,
#   render, engine, pptx, fonts, text. The fonts crate's build
#   script embeds the craft-fonts set when CRAFT_FONTS_DIR is set —
#   the build-windows client step sets it together with
#   CRAFT_FONTS_REQUIRED=1, so CJK coverage ships inside the
#   binary instead of degrading to .notdef on fontless machines.
deckcraft-model  = { path = "../../vendor/deckcraft/crates/model" }
deckcraft-render = { path = "../../vendor/deckcraft/crates/render" }
deckcraft-engine = { path = "../../vendor/deckcraft/crates/engine" }
deckcraft-pptx   = { path = "../../vendor/deckcraft/crates/pptx" }
deckcraft-fonts  = { path = "../../vendor/deckcraft/crates/fonts" }
deckcraft-text   = { path = "../../vendor/deckcraft/crates/text" }
# - Still reserved: pdf (T1 export), ui-egui (T2 show hosting).
# deckcraft-pdf    = { path = "../../vendor/deckcraft/crates/pdf" }
deckcraft-ui-egui = { path = "../../vendor/deckcraft/crates/ui-egui" }
# ---------------------------------------------------------------------------

# build.rs embeds the brand logo as the Windows executable icon.
[build-dependencies]
winresource = "0.1"
