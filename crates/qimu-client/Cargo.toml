[package]
name = "qimu-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "qimu-client"
path = "src/main.rs"

[dependencies]
qimu-core = { path = "../qimu-core" }
eframe = "0.29"
egui = "0.29"
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
rfd = "0.15"
aes-gcm = "0.10"
image = "0.25"
