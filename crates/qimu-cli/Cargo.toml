[package]
name = "qimu-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "qimu"
path = "src/main.rs"

[dependencies]
qimu-core = { path = "../qimu-core" }
qimu-bridge = { path = "../qimu-bridge" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
