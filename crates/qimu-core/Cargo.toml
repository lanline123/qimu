[package]
name = "qimu-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# DeckCraft native section write-back (PLAN §3.3 / §8 decision 5):
# OFF until the P0 section round-trip probe
# (tests/deckcraft_section_probe.rs, run in CI) passes. While OFF,
# `section_link::section_mode()` reports ManifestOnly — sections act
# as import split hints only, assembly writes no sections, and block
# boundaries live in the manifest alone (the accepted degradation).
deckcraft-sections = []

[dependencies]
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
argon2 = "0.5"
rand = "0.8"
# craft-libs (upstream storytold/craft-libs, consumed from our fork
# lanline123/craft-libs; MIT OR Apache-2.0), pinned git rev — see
# design/组件接入台账.md. Phase 1 (route plan §5 stage 1): the root
# [patch] tables redirect every craft-libs request in the graph to
# the vendor/craft-libs submodule, so this pin documents the baseline
# rev while the build compiles the submodule copy. The P0 note that
# kept craft-atomic apart on 0c144b7 is retired: atomic converges
# with the whole graph (route plan §6 item 2).
craft-atomic = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }
# Phase 3: the PPTX file layer (ZIP + XML + OPC) moves to craft-opc /
# craft-xml (craft-zip is craft-opc's archive engine). Pinned at the
# craft-libs rev the pending baseline convergence (fork-sync bump)
# targets for every craft crate, so the convergence only has to
# redirect the source to the lanline123 fork at this same rev.
craft-opc = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }
craft-xml = { git = "https://github.com/lanline123/craft-libs", rev = "b9c7b6970382acb1da090d83eb21e51f7006763a" }

# DeckCraft (lanline123/deckcraft, MIT OR Apache-2.0) enters as a git
# submodule at vendor/deckcraft (PLAN §4 form 1). P0 wires ONLY the
# section round-trip probe's minimal surface (model + pptx) and only
# as dev-dependencies, so production builds of core/server/cli stay
# DeckCraft-free until P1. P1 will promote render/engine/ui-egui
# path deps into qimu-client (reserved block there).
[dev-dependencies]
deckcraft-model = { path = "../../vendor/deckcraft/crates/model" }
deckcraft-pptx = { path = "../../vendor/deckcraft/crates/pptx" }
# Tests only since Phase 3: the section probe reads parts with it, and
# the file-layer regression tests build archives with it. Production
# code reads/writes packages through craft-opc/craft-zip.
zip = "2"
