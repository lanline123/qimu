[package]
name = "qimu-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PowerPoint bridge: drives the running PowerPoint via COM automation for in-place slide replacement (spec §4.3). Phase 1 = COM bridge, no add-in deployment."

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }
