[workspace]
resolver = "2"
# vendor/ holds independent storytold workspaces (see design/组件接入台账.md);
# excluding their roots keeps their workspace inheritance (edition 2024,
# rust-version, version) resolving against their own workspace manifests.
exclude = [
    "vendor/craft-libs",
    "vendor/pdfcraft",
    "vendor/deckcraft",
    "vendor/craft-ai-integrations",
    "vendor/craft-i18n",
    "vendor/figcraft-src",
]
members = [
    "crates/qimu-core",
    "crates/qimu-server",
    "crates/qimu-cli",
    "crates/qimu-client",
    "crates/qimu-bridge",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

# storytold vendored patches, mirrored from pdfcraft's own
# [patch.crates-io] (a [patch] only applies from the build's root
# workspace, so it must be restated here): pdfcraft-render's stack only
# builds against these patched copies — e.g. the vendored hayro-jbig2
# adds charge_reading/decode_within, which craft-stream-codecs calls and
# crates.io 0.3.0 does not have.
# Step 6: the egui family is patched to the storytold fork at the
# ecosystem's locked rev (same pins as craft-libs/deckcraft), incl. the
# storytold winit fork eframe builds against.
[patch.crates-io]
hayro = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
hayro-cmap = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
hayro-postscript = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
lopdf = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
vello_common = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
vello_cpu = { git = "https://github.com/storytold/pdfcraft", rev = "27287c297d25d505a8720ea6da2e7af38693bfa9" }
# krilla: mirrored from craft-libs' own root patch. Its crates/pdf is
# written against the vendored, patched krilla carried inside the
# craft-libs repo and refuses to compile against the crates.io
# original (compile-time tripwires in craft-pdf's write.rs: the
# CRAFT_UNWIND_POISONING / CRAFT_PRINT_COLOR / CRAFT_OPTIONAL_CONTENT
# constants; the vendored copy also carries SerializeSettings'
# group_color_space / output_intent / trapped and Metadata::
# modification_date). DeckCraft's root patch selects the same
# vendored copy via git. Without this line the unified graph
# resolves krilla v0.8.2 from crates.io and craft-pdf fails.
krilla = { path = "vendor/craft-libs/vendor/krilla" }
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-wgpu = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_extras = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# ---------------------------------------------------------------------------
# craft-libs single-baseline convergence (phase 1, route plan §5
# stage 1). craft-libs is requested by three parties in this graph:
# qimu itself (member pins name our fork lanline123/craft-libs @
# b9c7b69), DeckCraft (vendor submodule; its workspace pins
# storytold/craft-libs at five different revs) and PdfCraft (git
# dependency; its chain pins storytold/craft-libs @ e2dc681).
# Same-name/same-version packages from different revs are different
# crates to rustc, so the graph only converges if every request is
# redirected to one copy. [patch] applies from the build's root
# workspace only, hence this restatement here (same pattern as the
# pdfcraft hayro mirror above). Both source spellings are covered.
# Crates reached only as workspace-internal path deps inside
# craft-libs (craft-fonts-build via craft-ui, craft-stream-codecs
# via craft-pdf, craft-zip via craft-opc/craft-pptx) converge
# through the submodule workspace itself and need no entry here.
# Bumps: move the vendor/craft-libs submodule pointer and the
# member pins together, CI-gated.
[patch."https://github.com/storytold/craft-libs"]
craft-atomic = { path = "vendor/craft-libs/crates/atomic" }
craft-i18n = { path = "vendor/craft-libs/crates/i18n" }
craft-ui = { path = "vendor/craft-libs/crates/ui" }
craft-update = { path = "vendor/craft-libs/crates/update" }
craft-drawingml = { path = "vendor/craft-libs/crates/drawingml" }
craft-opc = { path = "vendor/craft-libs/crates/opc" }
craft-xml = { path = "vendor/craft-libs/crates/xml" }
craft-cfb = { path = "vendor/craft-libs/crates/cfb" }
craft-pptx = { path = "vendor/craft-libs/crates/pptx" }
craft-pdf = { path = "vendor/craft-libs/crates/pdf" }

[patch."https://github.com/lanline123/craft-libs"]
craft-atomic = { path = "vendor/craft-libs/crates/atomic" }
craft-i18n = { path = "vendor/craft-libs/crates/i18n" }
craft-ui = { path = "vendor/craft-libs/crates/ui" }
craft-update = { path = "vendor/craft-libs/crates/update" }
craft-drawingml = { path = "vendor/craft-libs/crates/drawingml" }
craft-opc = { path = "vendor/craft-libs/crates/opc" }
craft-xml = { path = "vendor/craft-libs/crates/xml" }
craft-cfb = { path = "vendor/craft-libs/crates/cfb" }
craft-pptx = { path = "vendor/craft-libs/crates/pptx" }
craft-pdf = { path = "vendor/craft-libs/crates/pdf" }
